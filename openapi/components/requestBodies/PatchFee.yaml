type: object
properties:
  type:
    description: Type of fee.
    type: string
    enum: ["buy", "sell"]
  title:
    type: string
    description: Title of the fee.
    minLength: 1
    maxLength: 255
    example: 'A gateway fee'
  filter:
    description: Filter transactions by specific parameters. Format is 'key:value,value;key:value'. For example, 'type:sale,capture;result:approved' will filter transactions of type 'sale' or 'capture' with result 'approved'..
    minLength: 1
    maxLength: 255
    example: 'type:sale,capture;result:approved'
    type:
      - 'string'
      - 'null'
  formula:
    $ref: ../schemas/FeeFormula.yaml
  settlementSettings:
    description: |-
      Fee settlement settings.
      This value overrides the gateway account financial settings of the transaction.
    oneOf:
      - $ref: ../schemas/SettlementSettings.yaml
      - type: 'null'
